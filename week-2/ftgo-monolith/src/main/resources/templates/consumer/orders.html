<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTGO - My Orders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .header { background: #27ae60; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header a { color: white; text-decoration: none; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        h2 { color: #2c3e50; margin-bottom: 15px; }
        .nav { margin-bottom: 20px; }
        .nav a { color: #27ae60; text-decoration: none; margin-right: 15px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #555; font-weight: 600; }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 0.8em; color: white; }
        .PLACED { background: #3498db; }
        .APPROVED { background: #2ecc71; }
        .PREPARING { background: #f39c12; }
        .READY_FOR_PICKUP { background: #e67e22; }
        .PICKED_UP { background: #9b59b6; }
        .DELIVERED { background: #27ae60; }
        .CANCELLED { background: #e74c3c; }
        .empty { text-align: center; padding: 40px; color: #999; background: white; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="/">FTGO</a> - Consumer Portal</h1>
        <a href="/consumer/restaurants">Browse Restaurants</a>
    </div>
    <div class="container">
        <div class="nav">
            <a href="/consumer/restaurants">Browse Restaurants</a>
            <a href="/consumer/orders?consumerId=1">My Orders</a>
        </div>
        <h2>My Orders</h2>
        <div th:if="${orders.isEmpty()}" class="empty">
            <p>No orders yet. <a href="/consumer/restaurants">Browse restaurants</a> to place your first order!</p>
        </div>
        <table th:if="${!orders.isEmpty()}">
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>Restaurant</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ordered At</th>
                    <th>Delivery Address</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">#</td>
                    <td th:text="${order.restaurant.name}">Restaurant</td>
                    <td>
                        <span th:each="item, stat : ${order.lineItems}">
                            <span th:text="${item.menuItem.name + ' x' + item.quantity}">Item</span>
                            <span th:if="${!stat.last}">, </span>
                        </span>
                    </td>
                    <td th:text="'Rs.' + ${order.totalAmount}">Amount</td>
                    <td><span class="status" th:classappend="${order.status}" th:text="${order.status}">Status</span></td>
                    <td th:text="${#temporals.format(order.orderTime, 'dd-MMM HH:mm')}">Time</td>
                    <td th:text="${order.deliveryAddress}">Address</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
